[package]
name = "foundry-evm-networks"
description = "Custom network features, like precompiles and custom tx types"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
foundry-evm-hardforks.workspace = true

alloy-chains.workspace = true
alloy-eips.workspace = true
alloy-op-hardforks = { workspace = true, optional = true }
alloy-primitives = { workspace = true, features = [
    "serde",
    "getrandom",
    "arbitrary",
    "rlp",
] }

# base
base-common-eip8130 = { workspace = true, optional = true }
base-evm2 = { workspace = true, optional = true }

# monad
monad-evm2 = { workspace = true, optional = true }

clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
serde.workspace = true
tempo-contracts.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
default = ["optimism"]
monad = ["dep:monad-evm2", "foundry-evm-hardforks/monad"]
optimism = ["dep:alloy-op-hardforks", "foundry-evm-hardforks/optimism"]
base = [
    "dep:base-common-eip8130",
    "dep:base-evm2",
    "foundry-evm-hardforks/base",
]

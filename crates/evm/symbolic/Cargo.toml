[package]
name = "foundry-evm-symbolic"
description = "Foundry symbolic EVM executor"
readme = "README.md"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
foundry-common.workspace = true
foundry-config.workspace = true
foundry-cheatcodes-spec.workspace = true
foundry-evm.workspace = true
foundry-solver = { git = "https://github.com/figtracer/foundry-native-solver.git", rev = "5fc9474e0d85eb5d07a48582753afc57372f8e39" }

alloy-dyn-abi.workspace = true
alloy-json-abi.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-sol-types.workspace = true
alloy-signer.workspace = true
alloy-signer-local = { workspace = true, features = ["mnemonic"] }

base64.workspace = true
hashbrown.workspace = true
inturn.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
shlex.workspace = true
thiserror.workspace = true
tracing.workspace = true
wait-timeout.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["optimism"]
optimism = ["foundry-evm/optimism"]

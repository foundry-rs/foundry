[package]
name = "foundry-evm-symbolic"
description = "Foundry symbolic EVM executor"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-primitives = { workspace = true, features = ["serde"] }
serde.workspace = true

# revm
foundry-common = { workspace = true, optional = true }
foundry-config = { workspace = true, optional = true }
foundry-cheatcodes-spec = { workspace = true, optional = true }
foundry-evm = { workspace = true, optional = true }

alloy-dyn-abi = { workspace = true, optional = true }
alloy-json-abi = { workspace = true, optional = true }
alloy-sol-types = { workspace = true, optional = true }
alloy-signer = { workspace = true, optional = true }
alloy-signer-local = { workspace = true, features = ["mnemonic"], optional = true }

base64 = { workspace = true, optional = true }
hashbrown = { workspace = true, optional = true }
inturn = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
shlex = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
wait-timeout = { workspace = true, optional = true }

[features]
default = ["optimism", "revm"]
base = ["revm", "foundry-evm/base"]
optimism = ["revm", "foundry-evm/optimism"]
revm = [
    "dep:foundry-common",
    "dep:foundry-config",
    "dep:foundry-cheatcodes-spec",
    "dep:foundry-evm",
    "dep:alloy-dyn-abi",
    "dep:alloy-json-abi",
    "dep:alloy-sol-types",
    "dep:alloy-signer",
    "dep:alloy-signer-local",
    "dep:base64",
    "dep:hashbrown",
    "dep:inturn",
    "dep:serde_json",
    "dep:shlex",
    "dep:thiserror",
    "dep:tracing",
    "dep:wait-timeout",
    "foundry-evm/revm",
]

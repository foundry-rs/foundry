[package]
name = "foundry-evm-core"
description = "Core EVM abstractions"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
foundry-cheatcodes-spec.workspace = true
foundry-common.workspace = true
foundry-compilers = { workspace = true, optional = true }
foundry-config.workspace = true
foundry-evm-abi.workspace = true
foundry-evm-hardforks.workspace = true
foundry-evm-networks.workspace = true

alloy-chains.workspace = true
alloy-dyn-abi = { workspace = true, features = ["arbitrary", "eip712"] }
alloy-evm = { workspace = true, optional = true, features = ["rpc"] }
alloy-genesis = { workspace = true, optional = true }
alloy-hardforks.workspace = true
alloy-json-abi.workspace = true
alloy-primitives = { workspace = true, features = [
    "serde",
    "getrandom",
    "arbitrary",
    "rlp",
] }
alloy-provider.workspace = true
alloy-rpc-client.workspace = true
alloy-network.workspace = true
alloy-consensus.workspace = true
alloy-monad-evm = { workspace = true, optional = true }
alloy-eips.workspace = true
alloy-op-evm = { workspace = true, optional = true }
alloy-rpc-types = { workspace = true, features = ["anvil"] }
alloy-sol-types.workspace = true
alloy-rlp.workspace = true
foundry-fork-db = { workspace = true, optional = true }

# Base
base-common-chains = { workspace = true, optional = true, features = ["std"] }
base-common-consensus = { workspace = true, optional = true, features = [
    "alloy-compat",
    "evm",
    "k256",
    "serde",
    "std",
] }
base-common-evm = { workspace = true, optional = true, features = [
    "blst",
    "c-kzg",
    "memory_limit",
    "optional_block_gas_limit",
    "optional_eip3607",
    "optional_no_base_fee",
    "serde",
    "std",
] }
base-common-network = { workspace = true, optional = true, features = ["serde", "std"] }
base-common-precompiles = { workspace = true, optional = true, features = ["std"] }
base-common-rpc-types = { workspace = true, optional = true, features = ["serde", "std"] }

revm = { workspace = true, optional = true, features = [
    "std",
    "serde",
    "memory_limit",
    "optional_eip3607",
    "optional_block_gas_limit",
    "optional_no_base_fee",
    "optional_priority_fee_check",
    "arbitrary",
    "c-kzg",
    "blst",
] }
revm-inspectors = { workspace = true, optional = true }
monad-revm = { workspace = true, optional = true }
op-alloy-consensus = { workspace = true, features = ["k256"], optional = true }
op-alloy-network = { workspace = true, optional = true }
op-alloy-rpc-types = { workspace = true, optional = true }
op-revm = { workspace = true, optional = true }
tempo-revm = { workspace = true, optional = true }
tempo-alloy = { workspace = true, optional = true }
tempo-hardfork = { workspace = true, optional = true }
tempo-contracts = { workspace = true, optional = true }
tempo-evm = { workspace = true, optional = true }
tempo-precompiles = { workspace = true, optional = true }

auto_impl = { workspace = true, optional = true }
evm2.workspace = true
evm2-macros.workspace = true
eyre.workspace = true
futures = { workspace = true, optional = true }
itertools.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time", "macros"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
alloy-serde.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true
anvil.workspace = true
foundry-test-utils.workspace = true
tempo-primitives.workspace = true

[[test]]
name = "base_replay"
path = "tests/base_replay.rs"
required-features = ["base"]

[features]
default = ["optimism", "revm"]
revm = [
    "dep:revm",
    "dep:foundry-compilers",
    "dep:revm-inspectors",
    "dep:alloy-evm",
    "dep:foundry-fork-db",
    "dep:tempo-revm",
    "dep:tempo-hardfork",
    "dep:tempo-alloy",
    "dep:tempo-evm",
    "dep:tempo-precompiles",
    "dep:tempo-contracts",
    "dep:alloy-genesis",
    "dep:futures",
    "dep:auto_impl",
    "dep:thiserror",
    "foundry-common/revm",
    "foundry-evm-hardforks/revm",
    "foundry-evm-networks/revm",
]
monad = [
    "revm",
    "anvil/monad",
    "dep:alloy-monad-evm",
    "dep:monad-revm",
    "foundry-evm-hardforks/monad",
    "foundry-evm-networks/monad",
]
base = [
    "revm",
    "anvil/base",
    "dep:base-common-chains",
    "dep:base-common-consensus",
    "dep:base-common-evm",
    "dep:base-common-network",
    "dep:base-common-precompiles",
    "dep:base-common-rpc-types",
    "foundry-common/base",
    "foundry-config/base",
    "foundry-evm-hardforks/base",
    "foundry-evm-networks/base",
]
optimism = [
    "revm",
    "dep:op-alloy-consensus",
    "dep:op-alloy-network",
    "dep:op-alloy-rpc-types",
    "dep:alloy-op-evm",
    "dep:op-revm",
    "foundry-common/optimism",
    "foundry-evm-hardforks/optimism",
    "foundry-evm-networks/optimism",
]

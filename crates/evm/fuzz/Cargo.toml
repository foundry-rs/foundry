[package]
name = "foundry-evm-fuzz"
description = "EVM fuzzing implementation using `proptest`"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
foundry-common.workspace = true
foundry-compilers.workspace = true
foundry-config.workspace = true
foundry-evm-core.workspace = true
foundry-evm-coverage.workspace = true
foundry-evm-traces.workspace = true

solar.workspace = true

alloy-dyn-abi = { workspace = true, features = ["arbitrary", "eip712"] }
alloy-json-abi.workspace = true
alloy-sol-types.workspace = true
alloy-primitives = { workspace = true, features = [
    "serde",
    "getrandom",
    "arbitrary",
    "rlp",
    "map-indexmap",
] }
revm = { workspace = true, optional = true, features = [
    "std",
    "serde",
    "memory_limit",
    "optional_eip3607",
    "optional_block_gas_limit",
    "optional_no_base_fee",
    "arbitrary",
] }

eyre.workspace = true
itertools.workspace = true
parking_lot.workspace = true
proptest.workspace = true
rand.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
default = ["optimism", "revm"]
revm = [
    "dep:revm",
    "foundry-common/revm",
    "foundry-evm-core/revm",
    "foundry-evm-coverage/revm",
    "foundry-evm-traces/revm",
]
monad = ["revm", "foundry-evm-core/monad"]
base = [
    "revm",
    "foundry-common/base",
    "foundry-evm-core/base",
    "foundry-evm-coverage/base",
    "foundry-evm-traces/base",
]
optimism = [
    "revm",
    "foundry-common/optimism",
    "foundry-evm-core/optimism",
    "foundry-evm-coverage/optimism",
    "foundry-evm-traces/optimism",
]

[package]
name = "foundry-evm-hardforks"
description = "EVM hardfork definitions for Foundry"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-chains.workspace = true
alloy-hardforks = { workspace = true, features = ["serde"] }
alloy-op-hardforks = { workspace = true, features = ["serde"], optional = true }
alloy-rpc-types.workspace = true
monad-revm = { workspace = true, optional = true }
base-common-genesis = { workspace = true, optional = true }
base-common-evm = { workspace = true, optional = true }
op-revm = { workspace = true, optional = true }
revm.workspace = true
serde = { workspace = true, features = ["derive"] }
tempo-hardfork.workspace = true

# evm2
evm2.workspace = true
tempo-hardfork-evm2.workspace = true
op-evm2 = { workspace = true, optional = true }
base-evm2 = { workspace = true, optional = true }
monad-evm2 = { workspace = true, optional = true }
foundry-compilers.workspace = true

[features]
default = ["optimism"]
monad = ["dep:monad-revm", "dep:monad-evm2"]
base = ["dep:base-common-genesis", "dep:base-common-evm", "dep:base-evm2"]
optimism = ["dep:alloy-op-hardforks", "dep:op-revm", "dep:op-evm2"]

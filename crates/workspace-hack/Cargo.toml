# Unifies the feature sets of third-party dependencies, so that switching between package selections
# (`--workspace`, `-p forge`, `-p cast`, ...) reuses the same compiled dependency units.
#
# Managed by `cargo hakari` (config: `.config/hakari.toml`). Every workspace crate depends on this
# one. Do not edit the section below by hand. After changing dependencies or features, run:
#
#     cargo hakari generate && cargo hakari manage-deps

[package]
name = "workspace-hack"
description = "Unifies third-party dependency features across workspace crates, managed by cargo-hakari"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

### BEGIN HAKARI SECTION
[dependencies]
ahash = { version = "0.8", features = ["no-rng"] }
aho-corasick = { version = "1" }

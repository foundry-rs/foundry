[package]
name = "reth-anvil"
description = "Local ethereum node built on the reth SDK"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "reth-anvil"
path = "bin/main.rs"

[dependencies]
# foundry internal
foundry-cli.workspace = true
foundry-common.workspace = true
foundry-config.workspace = true
foundry-evm-core.workspace = true
foundry-evm-hardforks.workspace = true
foundry-evm-networks.workspace = true
foundry-fork-db.workspace = true

# reth
reth-chain-state.workspace = true
reth-db-api.workspace = true
reth-engine-tree.workspace = true
reth-engine-util.workspace = true
reth-ethereum = { workspace = true, features = ["exex", "node", "node-api"] }
reth-node-events.workspace = true
reth-payload-builder.workspace = true
reth-prune-types.workspace = true
reth-rpc-eth-api.workspace = true
reth-rpc-server-types.workspace = true
reth-stages-types.workspace = true
reth-storage-overlay.workspace = true
reth-tokio-util.workspace = true

# alloy
alloy-consensus.workspace = true
alloy-dyn-abi.workspace = true
alloy-eips.workspace = true
alloy-evm.workspace = true
alloy-genesis.workspace = true
alloy-json-rpc.workspace = true
alloy-network.workspace = true
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-rpc-types = { workspace = true, features = ["anvil", "debug", "txpool"] }
alloy-rpc-types-engine.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-serde.workspace = true
alloy-signer.workspace = true
alloy-signer-local = { workspace = true, features = ["mnemonic"] }
alloy-sol-types.workspace = true

# revm
revm.workspace = true

# monad
alloy-monad-evm = { workspace = true, optional = true }
monad-revm = { workspace = true, optional = true }

# misc
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
chrono.workspace = true
clap_complete.workspace = true
eyre.workspace = true
fdlimit = "0.3"
flate2.workspace = true
futures.workspace = true
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
parking_lot.workspace = true
rand_08.workspace = true
rocksdb.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-stream.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["cors"] }
tracing.workspace = true
yansi.workspace = true

[features]
default = []
monad = [
    "foundry-evm-networks/monad",
    "foundry-evm-hardforks/monad",
    "dep:alloy-monad-evm",
    "dep:monad-revm",
]
base = ["foundry-evm-networks/base", "foundry-evm-hardforks/base"]
optimism = ["foundry-evm-networks/optimism", "foundry-evm-hardforks/optimism"]

[dev-dependencies]
alloy-chains.workspace = true
alloy-contract.workspace = true
alloy-provider = { workspace = true, features = ["txpool-api"] }
alloy-pubsub.workspace = true
alloy-sol-types = { workspace = true, features = ["json"] }
foundry-test-utils.workspace = true
futures.workspace = true
jsonrpsee = { version = "0.26", features = ["http-client", "ws-client"] }
rand.workspace = true

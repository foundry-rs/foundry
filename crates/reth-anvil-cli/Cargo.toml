[package]
name = "reth-anvil-cli"
description = "Anvil CLI with Ethereum and Tempo network extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "anvil"
path = "bin/main.rs"

[dependencies]
fdlimit = "0.3"
reth-anvil = { path = "../reth-anvil", default-features = false }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
alloy-genesis.workspace = true
alloy-primitives.workspace = true
alloy-signer-local.workspace = true
clap_complete.workspace = true
eyre.workspace = true
foundry-cli.workspace = true
foundry-common.workspace = true
foundry-config.workspace = true
foundry-evm-hardforks.workspace = true
foundry-evm-networks.workspace = true
rand_08.workspace = true
tokio.workspace = true
tracing.workspace = true

# tempo
reth-anvil-tempo = { path = "../reth-anvil-tempo", optional = true }

[features]
default = ["asm-keccak", "jemalloc", "js-tracer", "tempo"]
cli = []
asm-keccak = ["reth-anvil/asm-keccak"]
jemalloc = ["foundry-cli/jemalloc"]
mimalloc = ["foundry-cli/mimalloc"]
tracy-allocator = ["foundry-cli/tracy-allocator"]
js-tracer = ["reth-anvil/js-tracer"]
tempo = ["dep:reth-anvil-tempo"]
base = ["reth-anvil/base"]
optimism = ["reth-anvil/optimism"]

[dev-dependencies]
alloy-contract.workspace = true
alloy-provider.workspace = true
alloy-sol-types.workspace = true
foundry-evm-core.workspace = true
tempo-precompiles.workspace = true

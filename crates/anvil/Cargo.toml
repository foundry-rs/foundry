[package]
name = "anvil"
description = "Local ethereum node"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "anvil"
path = "bin/main.rs"
required-features = ["cli"]

[dependencies]
# foundry internal
anvil-core = { path = "core", default-features = false }
anvil-rpc = { path = "rpc" }
anvil-server = { path = "server" }
foundry-cli = { workspace = true, optional = true }
foundry-common.workspace = true
foundry-config.workspace = true
foundry-evm-core.workspace = true
foundry-evm-hardforks.workspace = true
foundry-evm-networks.workspace = true
foundry-evm-traces.workspace = true
foundry-fork-db.workspace = true
foundry-primitives = { workspace = true, default-features = false }
tempo-primitives.workspace = true

# evm2
evm2.workspace = true
evm2-inspectors.workspace = true
op-evm2 = { workspace = true, optional = true }
base-evm2 = { workspace = true, optional = true }
monad-evm2 = { workspace = true, optional = true }
tempo-evm.workspace = true
tempo-hardfork.workspace = true
tempo-precompiles.workspace = true

# Tempo consensus certificate primitives.
commonware-codec.workspace = true
commonware-cryptography = { workspace = true, features = ["bls12381", "std"] }
commonware-math.workspace = true
commonware-parallel.workspace = true
commonware-utils.workspace = true
rand_chacha.workspace = true
tempo-dkg-onchain-artifacts.workspace = true

# Base
base-common-chains = { workspace = true, optional = true, features = ["std"] }
base-common-consensus = { workspace = true, optional = true, features = ["k256", "serde", "std"] }
base-common-eip8130 = { workspace = true, optional = true, features = ["std"] }
base-common-genesis = { workspace = true, optional = true, features = ["std"] }
base-common-rpc-types = { workspace = true, optional = true, features = ["eip8130", "serde", "std"] }
base-consensus-upgrades = { workspace = true, optional = true, features = ["std"] }
base-protocol = { workspace = true, optional = true, features = ["std"] }

# alloy
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-consensus = { workspace = true, features = ["k256", "kzg"] }
alloy-contract = { workspace = true, features = ["pubsub"] }
alloy-network.workspace = true
alloy-eips.workspace = true
alloy-hardforks.workspace = true
alloy-rlp.workspace = true
alloy-signer = { workspace = true, features = ["eip712"] }
alloy-signer-local = { workspace = true, features = ["mnemonic"] }
alloy-sol-types = { workspace = true, features = ["std"] }
alloy-dyn-abi = { workspace = true, features = ["std", "eip712"] }
alloy-rpc-types = { workspace = true, features = ["anvil", "debug", "trace", "txpool"] }
alloy-rpc-types-beacon.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-rpc-types-mev.workspace = true
alloy-serde.workspace = true
alloy-provider = { workspace = true, features = [
    "reqwest",
    "ws",
    "ipc",
    "debug-api",
    "trace-api",
] }
alloy-transport.workspace = true
alloy-chains.workspace = true
alloy-genesis.workspace = true
alloy-trie = { workspace = true, features = ["std"] }
op-alloy-consensus = { workspace = true, features = ["serde"], optional = true }
op-alloy-rpc-types = { workspace = true, optional = true }

# axum related
axum.workspace = true
hyper.workspace = true

# tracing
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# async
tokio = { workspace = true, features = ["time"] }
parking_lot.workspace = true
futures.workspace = true
async-trait.workspace = true
auto_impl.workspace = true

# misc
flate2.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
yansi.workspace = true
tempfile.workspace = true
itertools.workspace = true
imbl.workspace = true
rand_08.workspace = true
eyre.workspace = true
ethereum_ssz.workspace = true

# cli
clap = { version = "4", features = [
    "derive",
    "env",
    "wrap_help",
], optional = true }
clap_complete = { workspace = true, optional = true }
chrono.workspace = true
ctrlc = { version = "3", optional = true }
fdlimit = { version = "0.3", optional = true }

[dev-dependencies]
alloy-provider = { workspace = true, features = ["txpool-api"] }
alloy-pubsub.workspace = true
rand.workspace = true
reqwest.workspace = true
foundry-test-utils.workspace = true

tempo-alloy.workspace = true
tempo-precompiles = { workspace = true, features = ["rpc"] }

[features]
default = ["cli", "jemalloc", "asm-keccak", "optimism", "js-tracer"]
monad = [
    "dep:monad-evm2",
    "foundry-config/monad",
    "foundry-evm-core/monad",
    "foundry-evm-hardforks/monad",
    "foundry-evm-networks/monad",
    "foundry-evm-traces/monad",
    "foundry-cli?/monad",
]
base = [
    "dep:base-common-chains",
    "dep:base-common-consensus",
    "dep:base-common-eip8130",
    "dep:base-common-genesis",
    "dep:base-common-rpc-types",
    "dep:base-consensus-upgrades",
    "dep:base-protocol",
    "dep:op-alloy-consensus",
    "dep:base-evm2",
    "anvil-core/base",
    "foundry-primitives/base",
    "foundry-common/base",
    "foundry-config/base",
    "foundry-evm-core/base",
    "foundry-evm-hardforks/base",
    "foundry-evm-networks/base",
    "foundry-evm-traces/base",
    "foundry-cli?/base",
]
optimism = [
    "dep:op-alloy-consensus",
    "dep:op-alloy-rpc-types",
    "dep:op-evm2",
    "anvil-core/optimism",
    "foundry-primitives/optimism",
    "foundry-common/optimism",
    "foundry-evm-core/optimism",
    "foundry-evm-hardforks/optimism",
    "foundry-evm-traces/optimism",
    "foundry-cli?/optimism",
]
asm-keccak = ["alloy-primitives/asm-keccak"]
jemalloc = ["foundry-cli?/jemalloc"]
mimalloc = ["foundry-cli?/mimalloc"]
tracy-allocator = ["foundry-cli?/tracy-allocator"]
cli = ["tokio/full", "cmd"]
cmd = [
    "dep:foundry-cli",
    "clap",
    "clap_complete",
    "dep:fdlimit",
    "dep:ctrlc",
    "anvil-server/clap",
    "tokio/signal",
]
js-tracer = ["evm2-inspectors/js-tracer"]

[package]
name = "anvil-tempo-consensus-compat"
version = "0.0.0"
edition = "2024"
publish = false

# Keep the native consensus runtime out of Anvil's dependency graph and workspace lockfile.
[workspace]

[dependencies]
alloy-consensus = "=2.5.0"
alloy-primitives = { version = "=1.7.3", features = ["serde"] }
commonware-codec = "=2026.9.0"
commonware-consensus = "=2026.9.0"
commonware-cryptography = { version = "=2026.9.0", features = ["bls12381", "std"] }
commonware-math = "=2026.9.0"
commonware-parallel = "=2026.9.0"
rand_chacha = "=0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempo-primitives = { git = "https://github.com/tempoxyz/tempo", rev = "2c25f7cd8267b205a6b95e08bbc73baf887bea88", default-features = false, features = ["serde"] }

[patch.crates-io]
tempo-primitives = { git = "https://github.com/tempoxyz/tempo", rev = "2c25f7cd8267b205a6b95e08bbc73baf887bea88" }

[profile.dev]
debug = 0
incremental = false

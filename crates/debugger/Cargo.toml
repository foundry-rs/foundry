[package]
name = "foundry-debugger"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
foundry-common.workspace = true
foundry-compilers.workspace = true
foundry-evm-traces.workspace = true
foundry-evm-core.workspace = true
foundry-tui.workspace = true

alloy-primitives.workspace = true
alloy-dyn-abi.workspace = true

clap = { version = "4", features = ["derive"] }
crossterm.workspace = true
eyre.workspace = true
ratatui = { workspace = true, features = ["crossterm"] }
revm.workspace = true
tracing.workspace = true
serde.workspace = true

# soldb
dialoguer = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
soldb-core = { workspace = true, optional = true }
soldb-debugger = { workspace = true, optional = true }
soldb-ethdebug = { workspace = true, optional = true }
soldb-repl = { workspace = true, optional = true }
soldb-tui = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["optimism"]
base = [
    "foundry-common/base",
    "foundry-evm-core/base",
    "foundry-evm-traces/base",
]
optimism = [
    "foundry-common/optimism",
    "foundry-evm-core/optimism",
    "foundry-evm-traces/optimism",
]
soldb = [
    "dep:dialoguer",
    "dep:serde_json",
    "dep:soldb-core",
    "dep:soldb-debugger",
    "dep:soldb-ethdebug",
    "dep:soldb-repl",
    "dep:soldb-tui",
]

[package]
name = "foundry-common"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
foundry-block-explorers = { workspace = true, features = ["foundry-compilers"] }
foundry-common-fmt.workspace = true
foundry-compilers.workspace = true
foundry-config.workspace = true

alloy-chains.workspace = true
alloy-dyn-abi = { workspace = true, features = ["arbitrary", "eip712"] }
alloy-eips.workspace = true
alloy-json-abi.workspace = true
alloy-json-rpc.workspace = true
alloy-primitives = { workspace = true, features = [
    "serde",
    "getrandom",
    "arbitrary",
    "rlp",
] }
alloy-provider.workspace = true
alloy-signer.workspace = true
alloy-pubsub.workspace = true
alloy-rpc-client.workspace = true
alloy-rpc-types = { workspace = true, features = ["eth", "engine"] }
alloy-rpc-types-engine = { workspace = true, features = ["jwt-aws-lc-rs"] }
alloy-sol-types.workspace = true
alloy-transport-ipc.workspace = true
alloy-transport-ws.workspace = true
alloy-transport.workspace = true
alloy-transport-mpp.workspace = true
alloy-consensus = { workspace = true, features = ["k256"] }
alloy-network.workspace = true

op-alloy-network = { workspace = true, optional = true }
op-alloy-rpc-types = { workspace = true, optional = true }

# Base
base-common-network = { workspace = true, optional = true, features = ["serde", "std"] }
base-common-rpc-types = { workspace = true, optional = true, features = ["serde", "std"] }

revm.workspace = true

solar.workspace = true

tower.workspace = true

clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
alloy-rlp.workspace = true
comfy-table.workspace = true
dunce.workspace = true
eyre.workspace = true
itertools.workspace = true
jiff.workspace = true
num-format.workspace = true
path-slash.workspace = true
regex.workspace = true
reqwest.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
walkdir.workspace = true
yansi.workspace = true

anstream.workspace = true
anstyle.workspace = true
ciborium.workspace = true

flate2.workspace = true
tempo-alloy.workspace = true
tempo-primitives.workspace = true
mpp.workspace = true
foundry-wallets = { workspace = true, features = ["browser", "tempo"] }
alloy-signer-local = { workspace = true, features = ["mnemonic-all-languages"] }
base64.workspace = true
sha2 = "0.11"

[build-dependencies]
chrono.workspace = true
vergen = { workspace = true, features = ["build", "emit_and_set"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
axum = { workspace = true }
foundry-evm-hardforks.workspace = true
k256 = { workspace = true }
tempfile.workspace = true

[features]
default = ["optimism"]
monad = ["foundry-config/monad"]
base = [
    "dep:base-common-network",
    "dep:base-common-rpc-types",
    "foundry-common-fmt/base",
    "foundry-config/base",
]
optimism = [
    "dep:op-alloy-network",
    "dep:op-alloy-rpc-types",
    "foundry-common-fmt/optimism",
]

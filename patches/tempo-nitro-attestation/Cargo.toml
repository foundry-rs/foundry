# Vendored from tempoxyz/tempo@b97d16de (crates/nitro-attestation) with the exact `arrayvec` pin
# relaxed. Tempo's revm pin and its evm2 PR pin different exact versions, which cannot resolve in one
# lockfile. Remove once Foundry drops the revm-based Tempo pin.
[package]
name = "tempo-nitro-attestation"
description = "Consensus-critical AWS Nitro attestation parsing and verification"
version = "1.16.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["Tempo Contributors"]
license = "MIT OR Apache-2.0"
homepage = "https://docs.tempo.xyz"
repository = "https://github.com/tempoxyz/tempo"
publish = false

[features]
aws-lc = ["dep:aws-lc-rs"]

[dependencies]
arrayvec = { version = "0.7.6", default-features = false, features = ["serde"] }
hex-literal = "1"
minicbor = { version = "=2.3.0", default-features = false, features = ["alloc"] }
minicbor-serde = { version = "=0.7.1", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_with = { version = "=3.21.0", default-features = false, features = ["alloc"] }
x509-cert = { version = "=0.2.5", default-features = false }

# aws-lc
aws-lc-rs = { version = "1.17.0", optional = true, default-features = false, features = ["alloc", "non-fips", "ring-sig-verify"] }

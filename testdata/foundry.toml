[profile.default]
src = "src"
test = "./"
remappings = ["@cheats/=default/cheats/"]
optimizer = true
optimizer_runs = 200
via_ir = false
ignored_error_codes = [
    1878, # SPDX license identifier not provided
    2018, # Function state mutability can be restricted
    2072, # Unused local variable
    2424, # Natspec memory-safe-assembly special comment deprecated
    2519, # This declaration shadows an existing declaration
    3860, # Contract init code size exceeds limit
    5159, # Selfdestruct has been deprecated
    5574, # Contract code size exceeds limit
    5667, # Unused function parameter
    9207, # 'transfer' is deprecated
]
extra_output = ["storageLayout"]

additional_compiler_profiles = [
    # paris - EVM version paris for testing profile selection
    { name = "paris", evm_version = "paris" },
    # no-metadata - stable bytecode for cross-platform multi-version tests
    { name = "no-metadata", bytecode_hash = "None" },
]
compilation_restrictions = [
    # paris - files in paris/ directory use paris EVM version
    { paths = "paris/**", evm_version = "paris" },
    # Keep multi-version bytecode stable across platforms while preserving the encoded solc version.
    { paths = "multi-version/**", bytecode_hash = "None" },
]

ffi = true
fs_permissions = [
    { access = "read-write", path = "out/" },
    { access = "read-write", path = "fixtures/" },
]
verbosity = 3
prompt_timeout = 0

[profile.default.rpc_storage_caching]
chains = "all"
endpoints = "all"

[profile.default.invariant]
depth = 15

[fmt]
ignore = ["cheats/Vm.sol"]

[lint]
lint_on_build = false

# These are set in .env, which is populated when running through `cargo (nex)test`.
[rpc_endpoints]
mainnet = "${RPC_MAINNET}"
mainnet2 = "${RPC_MAINNET2}"
sepolia = "${RPC_SEPOLIA}"
optimism = "${RPC_OPTIMISM}"
base = "${RPC_BASE}"
arbitrum = "${RPC_ARBITRUM}"
polygon = "${RPC_POLYGON}"
bsc = "${RPC_BSC}"
avaxTestnet = "https://api.avax-test.network/ext/bc/C/rpc"
moonbeam = "https://moonbeam.api.onfinality.io/public"
polkadotTestnet = "https://eth-rpc-testnet.polkadot.io"
kusama = "https://eth-rpc-kusama.polkadot.io"
polkadot = "https://eth-rpc.polkadot.io"
rpcEnvAlias = "${RPC_ENV_ALIAS}"

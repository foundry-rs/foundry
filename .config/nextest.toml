[test-groups]
# The on-chain deploy+verify tests share one funded deployer per network and one Etherscan key.
# Running them concurrently collides on the account nonce and trips Etherscan's 3 calls/sec limit.
deploy-verify = { max-threads = 1 }
# The Tempo canaries fork public endpoints that rate limit concurrent replays.
tempo-canary = { max-threads = 1 }
# Generated binding crates share one Cargo target directory and serialize on its build lock.
bindings = { max-threads = 1 }

[profile.default]
retries = { backoff = "exponential", count = 2, delay = "5s", jitter = true }
slow-timeout = { period = "30s", terminate-after = 3 }
# Exclude flaky tests from regular CI runs - they run in nightly test-flaky workflow.
# Exclude the on-chain deploy+verify tests too - they spend testnet funds and depend on external
# verifier services, so they run in the nightly test-deploy-verify workflow.
default-filter = "not test(/flaky_/) and not test(/deploy_verify_/)"

[[profile.default.overrides]]
filter = "test(/ext_integration/)"
slow-timeout = { period = "5m", terminate-after = 4 }

# The symbolic conformance and limits suites only do work with SYMBOLIC_CONFORMANCE and
# SYMBOLIC_LIMITS set, as the nightly test-flaky workflow does; the stateful invariant cases there
# take minutes in debug builds.
[[profile.default.overrides]]
filter = "test(/symbolic_conformance::|symbolic_limits::/)"
slow-timeout = { period = "5m", terminate-after = 4 }

# Integration-style CLI tests can exceed the default 90s timeout on slower
# Windows, macOS, and ARM runners while shelling out to forge/solc/git.
[[profile.default.overrides]]
filter = "test(/(^|::)bind_event_module_name_shadowing$/) | test(/(^|::)bind_event_module_prefix_does_not_shadow_aliases$/) | test(/(^|::)can_bind_e2e$/) | test(/(^|::)test_clone_/) | test(/(^|::)can_deploy_and_simulate_25_txes_concurrently$/) | test(/(^|::)can_deploy_25_txes_concurrently_across_full_blocks$/) | test(/(^|::)can_deploy_25_txes_concurrently_with_interval_mining$/) | test(/(^|::)can_deploy_25_txes_concurrently_with_mixed_mining$/) | test(/(^|::)chisel_can_run_with_live_logs_flag$/) | test(/(^|::)session_wrapper_uses_project_config_for_cast_session$/)"
slow-timeout = { period = "5m", terminate-after = 4 }

[[profile.default.overrides]]
filter = "test(/tempo_canary::/)"
test-group = "tempo-canary"

# Cold runs fetch pinned Solidity sources and install the fixture's Solc version.
[[profile.default.overrides]]
filter = "package(=forge) & binary(=cli) & test(/(^|::)tempo_proofs_fork$/)"
slow-timeout = { period = "5m", terminate-after = 2, grace-period = "0s" }

# Do not re-run so that `cargo cheats` is ran locally.
[[profile.default.overrides]]
filter = "package(foundry-cheatcodes-spec)"
retries = 0

# The CI profile inherits the default filters, retries, timeouts, and groups.
# Start the long tail before the short tests so it does not keep the runner idle at the end.
[[profile.ci.overrides]]
filter = "package(=forge) & binary(=cli) & (test(=test_cmd::testdata) | test(=test_cmd::symbolic_parity::halmos::minivat_linear_smoke_parity) | test(=test_cmd::symbolic_parity::openzeppelin::erc721_unique_ownership_passes) | test(=test_cmd::symbolic_invariant::symbolic_transient_storage_clears_between_sequence_steps))"
priority = 100

# Let nextest queue these instead of occupying several test slots waiting for the same Cargo lock.
[[profile.ci.overrides]]
filter = "package(=forge) & binary(=cli) & (test(=cmd::can_bind_e2e) | test(/^bind::bind_(generates_enum_variants|event_module_name_shadowing|event_module_prefix_does_not_shadow_aliases|regression_fixtures_compile|single_file_crate_and_module_match|dollar_sign_in_contract_name)$/))"
test-group = "bindings"
priority = 50

# Profile for running flaky tests (used by nightly CI and for local debugging)
# Run with: cargo nextest run --profile flaky
[profile.flaky]
default-filter = "test(/flaky_/)"
retries = { backoff = "exponential", count = 5, delay = "10s", jitter = true }
slow-timeout = { period = "60s", terminate-after = 3 }

# The fork smoke tests report an unreachable endpoint by skipping instead of failing, so keep
# their output on success to show which chains a run actually exercised.
[[profile.flaky.overrides]]
filter = "test(/fork_chains::/)"
success-output = "final"

# The network read tests report an unreachable endpoint or an unusable block by skipping instead
# of failing, so keep their output on success to show which networks a run actually exercised.
[[profile.flaky.overrides]]
filter = "test(/read_networks::/)"
success-output = "final"

# Profile for the on-chain deploy+verify tests (used by the nightly test-deploy-verify workflow).
# Requires <NETWORK>_RPC_URL plus TESTNET_DEPLOYER_PRIVATE_KEY to do anything.
# Run with: cargo nextest run --profile deploy-verify
[profile.deploy-verify]
# Blockscout tests are temporarily disabled because Blockscout's verifier does not support recent
# Solidity versions yet: https://github.com/foundry-rs/foundry/issues/17733
default-filter = "test(/deploy_verify_/) and not test(/_blockscout$/)"
retries = 1
# A deploy plus verifier round trip is minutes, not seconds.
slow-timeout = { period = "120s", terminate-after = 5 }

[[profile.deploy-verify.overrides]]
filter = "test(/deploy_verify_/)"
test-group = "deploy-verify"

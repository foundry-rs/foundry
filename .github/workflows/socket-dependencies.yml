name: Socket dependency policy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
      id-token: write
    name: Check locked dependencies through Socket
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: ""
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@09dddc697b1c8c1d3c3733b41d6fdd2274f17734
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Fetch locked dependencies through Socket with an empty cache
        shell: bash
        run: bash .github/scripts/socket-dependencies.sh

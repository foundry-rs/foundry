name: Refresh Tempo lockfile

on:
  pull_request:

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo update
      - uses: actions/upload-artifact@v6
        with:
          name: refreshed-tempo-lock
          path: Cargo.lock

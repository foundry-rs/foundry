# Nightly job to verify each crate compiles independently (catches missing deps/features
# masked by Cargo's workspace feature unification).

name: crate-checks

permissions: {}

on:
  schedule:
    - cron: "0 2 * * *" # Run daily at 2 AM UTC (offset from test-flaky)
  workflow_dispatch: # Needed so we can run it manually

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"

jobs:
  socket-dependencies:
    if: |
      github.event_name != 'schedule' || github.repository == 'foundry-rs/foundry'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/socket-dependencies.yml

  crate-checks:
    needs: socket-dependencies
    if: github.event_name != 'schedule' || github.repository == 'foundry-rs/foundry'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@09dddc697b1c8c1d3c3733b41d6fdd2274f17734
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-hack
      - uses: ./.github/actions/setup-sccache
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo hack check --locked

  issue:
    name: Open an issue
    runs-on: ubuntu-latest
    needs: [socket-dependencies, crate-checks]
    if: failure()
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@09dddc697b1c8c1d3c3733b41d6fdd2274f17734
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_URL: |
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          update_existing: true
          filename: .github/CRATE_CHECKS_FAILURE_TEMPLATE.md

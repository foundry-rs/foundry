# Nightly job to verify each crate compiles independently (catches missing deps/features
# masked by Cargo's workspace feature unification).

name: crate-checks

permissions: {}

on:
  schedule:
    - cron: "0 2 * * *" # Run daily at 2 AM UTC (offset from test-flaky)
  workflow_dispatch: # Needed so we can run it manually

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"

jobs:
  dependencies:
    if: github.event_name != 'schedule' || github.repository == 'foundry-rs/foundry'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/dependencies.yml

  crate-checks:
    needs: dependencies
    if: github.event_name != 'schedule' || github.repository == 'foundry-rs/foundry'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        id: security
        uses: tempoxyz/gh-actions/actions/secure-runner@2794671f2a6e696217c8128ad4553a75bbba2709
        with:
          shims: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          artifact-id: ${{ needs.dependencies.outputs.artifact-id }}
          sha256: ${{ needs.dependencies.outputs.sha256 }}
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-hack@0.6.45
      - run: cargo hack check --frozen

  issue:
    name: Open an issue
    runs-on: ubuntu-latest
    needs: [dependencies, crate-checks]
    if: failure()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_URL: |
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          update_existing: true
          filename: .github/CRATE_CHECKS_FAILURE_TEMPLATE.md

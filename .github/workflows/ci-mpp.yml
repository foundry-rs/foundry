name: CI MPP

permissions: {}

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      network:
        description: "Tempo network to check"
        required: true
        type: choice
        default: "moderato"
        options:
          - moderato
          - mainnet
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"

jobs:
  mpp-check:
    # Skip on PRs from forks (only run for branches in foundry-rs/foundry, i.e. maintainer PRs).
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: depot-ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    env:
      NODE_OPTIONS: --no-network-family-autoselection
      SFW_UNKNOWN_HOST_ACTION: ignore
      SFW_CUSTOM_REGISTRIES: wrap:binaries.soliditylang.org,wrap:raw.githubusercontent.com/nikitastupin/solc,wrap:raw.githubusercontent.com/alloy-rs/solc-builds
    defaults:
      run:
        shell: bash
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@6e62935eb0bfeac202d19c425f742dc1dcd88f5d
        with:
          egress-policy: audit
      # Checkout the repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # Start outside Socket so the cache daemon keeps its own proxy settings.
      - run: sccache --start-server

      # Isolate downloads from compilation, retaining the same Socket wrapper.
      - name: Fetch dependencies through Socket
        env:
          SFW_DEBUG: "true"
          SFW_JSON_REPORT_PATH: ${{ runner.temp }}/sfw-mpp-fetch-raw/report.json
        run: |
          mkdir -p "$RUNNER_TEMP/sfw-mpp-fetch-raw"
          cargo fetch --locked > "$RUNNER_TEMP/sfw-mpp-fetch-raw/fetch.log" 2>&1

      - name: Collect sanitized Socket fetch diagnostics
        if: always()
        run: node .github/scripts/sanitize-sfw-diagnostics.cjs fetch

      # Build and install binaries.
      - name: Build and install Foundry binaries
        env:
          # Temporary diagnostics for the repeated Socket download termination.
          SFW_DEBUG: "true"
          SFW_JSON_REPORT_PATH: ${{ runner.temp }}/sfw-mpp-build-raw/report.json
        run: |
          mkdir -p "$RUNNER_TEMP/sfw-mpp-build-raw"
          cargo build --profile dev --locked --bin forge --bin cast --bin anvil --bin chisel > "$RUNNER_TEMP/sfw-mpp-build-raw/build.log" 2>&1
          echo "${{ github.workspace }}/target/debug" >> "$GITHUB_PATH"

      - name: Collect sanitized Socket diagnostics
        if: always()
        run: node .github/scripts/sanitize-sfw-diagnostics.cjs

      - name: Upload Socket diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sfw-mpp-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sfw-mpp-diagnostics/
          if-no-files-found: warn
          retention-days: 3

      - name: Restore bounded NanoUSD wallet
        if: |
          github.event_name == 'workflow_dispatch' &&
          (inputs.network == 'mainnet' || inputs.network == 'all')
        env:
          TEMPO_ACCOUNTS_STORE_JSON_B64: ${{ secrets.TEMPO_ACCOUNTS_STORE_JSON_B64 }}
          TEMPO_HOME: ${{ runner.temp }}/tempo-mpp-mainnet
        run: |
          if [ -z "$TEMPO_ACCOUNTS_STORE_JSON_B64" ]; then
            echo "TEMPO_ACCOUNTS_STORE_JSON_B64 is not configured"
            exit 1
          fi
          mkdir -p "$TEMPO_HOME/wallet"
          printf '%s' "$TEMPO_ACCOUNTS_STORE_JSON_B64" | base64 --decode > "$TEMPO_HOME/wallet/store.json"
          chmod 600 "$TEMPO_HOME/wallet/store.json"

      - name: Run Moderato MPP e2e test
        if: |
          github.event_name != 'workflow_dispatch' ||
          inputs.network == 'moderato' ||
          inputs.network == 'all'
        env:
          MPP_API_KEY: ${{ secrets.MPP_API_KEY }}
          MPP_ALLOW_API_KEY: "1"
          TEMPO_HOME_BASE: ${{ runner.temp }}/tempo-mpp-moderato
          TEMPO_AUTO_FUND: "1"
          TEMPO_ROTATE_WALLET: "1"
          MPP_RPC_URL: https://rpc.mpp.moderato.tempo.xyz
          TEMPO_RPC_URL: https://rpc.moderato.tempo.xyz
          MPP_TOKEN: "0x20c0000000000000000000000000000000000000"
        run: |
          for attempt in 1 2 3; do
            export TEMPO_HOME="${TEMPO_HOME_BASE}-${attempt}"
            log="${RUNNER_TEMP}/tempo-mpp-${attempt}.log"
            if ./.github/scripts/tempo-mpp.sh "$(which cast | xargs dirname)" 2>&1 | tee "$log"; then
              exit 0
            fi
            if ! grep -Eq 'HTTP error 402|replaced reusable channel|did not reuse channel' "$log"; then
              exit 1
            fi
            echo "Transient MPP gateway failure on attempt ${attempt}/3"
          done
          exit 1

      - name: Run mainnet MPP e2e test
        if: |
          github.event_name == 'workflow_dispatch' &&
          (inputs.network == 'mainnet' || inputs.network == 'all')
        env:
          TEMPO_HOME: ${{ runner.temp }}/tempo-mpp-mainnet
          MPP_RPC_URL: https://rpc.mpp.tempo.xyz
          TEMPO_RPC_URL: https://rpc.tempo.xyz
          MPP_TOKEN: "0x20c0000000000000000000008b4c619d2eedec7a"
        run: ./.github/scripts/tempo-mpp.sh "$(which cast | xargs dirname)"

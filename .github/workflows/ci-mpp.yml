name: CI MPP

permissions: {}

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Tempo network to check"
        required: true
        type: choice
        default: "moderato"
        options:
          - moderato
          - mainnet
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  dependencies:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/dependencies.yml

  mpp-check:
    needs: dependencies
    uses: ./.github/workflows/mpp.yml
    permissions:
      contents: read
      id-token: write
    with:
      artifact-id: ${{ needs.dependencies.outputs.artifact-id }}
      sha256: ${{ needs.dependencies.outputs.sha256 }}
      network: ${{ inputs.network }}
    secrets:
      MPP_API_KEY: ${{ secrets.MPP_API_KEY }}
      TEMPO_ACCOUNTS_STORE_JSON_B64: ${{ secrets.TEMPO_ACCOUNTS_STORE_JSON_B64 }}

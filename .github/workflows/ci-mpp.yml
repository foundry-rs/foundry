name: CI MPP

permissions: {}

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Tempo network to check"
        required: true
        type: choice
        default: "moderato"
        options:
          - moderato
          - mainnet
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  socket-dependencies:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/socket-dependencies.yml

  mpp-check:
    needs: socket-dependencies
    uses: ./.github/workflows/mpp.yml
    permissions:
      id-token: write
      contents: read
    with:
      network: ${{ inputs.network }}
    secrets:
      MPP_API_KEY: ${{ secrets.MPP_API_KEY }}
      TEMPO_ACCOUNTS_STORE_JSON_B64: ${{ secrets.TEMPO_ACCOUNTS_STORE_JSON_B64 }}

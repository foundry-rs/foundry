# Daily CI job to run flaky tests that are excluded from regular CI via nextest default-filter

name: test-flaky

permissions: {}

on:
  schedule:
    - cron: "0 1 * * *" # Run daily at 1 AM UTC
  workflow_dispatch: # Needed so we can run it manually

concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"

jobs:
  dependencies:
    if: github.event_name != 'schedule' || github.repository == 'foundry-rs/foundry'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/dependencies.yml

  test:
    name: flaky tests
    needs: dependencies
    if: github.event_name != 'schedule' || github.repository == 'foundry-rs/foundry'
    runs-on: depot-ubuntu-latest-16
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        id: security
        uses: tempoxyz/gh-actions/actions/secure-runner@2794671f2a6e696217c8128ad4553a75bbba2709
        with:
          shims: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          artifact-id: ${{ needs.dependencies.outputs.artifact-id }}
          sha256: ${{ needs.dependencies.outputs.sha256 }}
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest@0.9.143
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Vyper
        # Also update vyper version in .devcontainer/Dockerfile.dev
        env:
          SFW: ${{ steps.security.outputs.firewall-path-binary }}
        run: '"$SFW" pip install vyper==0.4.3'
      - name: Test flaky tests
        env:
          SVM_TARGET_PLATFORM: linux-amd64
          ETHERSCAN_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          ARBITRUM_RPC: ${{ secrets.ARBITRUM_RPC }}
          ETH_SEPOLIA_RPC: ${{ secrets.ETH_SEPOLIA_RPC }}
          CELO_RPC: ${{ secrets.CELO_RPC }}
          GNOSIS_RPC: ${{ secrets.GNOSIS_RPC }}
          HYPERLIQUID_RPC: ${{ secrets.HYPERLIQUID_RPC }}
          ROBINHOOD_RPC: ${{ secrets.ROBINHOOD_RPC }}
        run: cargo nextest run --frozen --profile flaky --no-fail-fast

  # If any of the jobs fail, this will create a normal-priority issue to signal so.
  issue:
    name: Open an issue
    runs-on: ubuntu-latest
    needs: [dependencies, test]
    if: failure()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_URL: |
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          update_existing: true
          filename: .github/FLAKY_TEST_FAILURE_TEMPLATE.md

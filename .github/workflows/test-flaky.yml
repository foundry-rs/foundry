# Daily CI job to run flaky tests that are excluded from regular CI via nextest default-filter

name: test-flaky

permissions: {}

on:
  schedule:
    - cron: "0 1 * * *" # Run daily at 1 AM UTC
  workflow_dispatch: # Needed so we can run it manually

concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"

jobs:
  test:
    name: flaky tests
    if: github.event_name != 'schedule' || github.repository == 'foundry-rs/foundry'
    runs-on: depot-ubuntu-latest-16
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@2ab28a31ae569be9f780c7675b684471060afa40
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: nextest
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Same as test.yml: avoids building Vyper's `immutables` dependency from source.
          python-version: "3.13"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip==26.2.2
      - name: Install Vyper
        # Also update vyper version in .devcontainer/Dockerfile.dev
        run: pip --version && pip install vyper==0.4.3
      - name: Install Z3
        # Same pin as test.yml, for the symbolic suites below.
        run: pip install z3-solver==5.3.2.0 && z3 --version
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test flaky tests
        env:
          SVM_TARGET_PLATFORM: linux-amd64
          ETHERSCAN_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          ARBITRUM_RPC: ${{ secrets.ARBITRUM_RPC }}
          ETH_SEPOLIA_RPC: ${{ secrets.ETH_SEPOLIA_RPC }}
          CELO_RPC: ${{ secrets.CELO_RPC }}
          GNOSIS_RPC: ${{ secrets.GNOSIS_RPC }}
          HYPERLIQUID_RPC: ${{ secrets.HYPERLIQUID_RPC }}
          ROBINHOOD_RPC: ${{ secrets.ROBINHOOD_RPC }}
        run: cargo nextest run --locked --profile flaky --no-fail-fast
      # Broader and slower symbolic coverage that PR CI skips; the tests return early unless these
      # variables are set.
      - name: Test symbolic conformance and limits
        if: ${{ !cancelled() }}
        env:
          SVM_TARGET_PLATFORM: linux-amd64
          SYMBOLIC_CONFORMANCE: 1
          SYMBOLIC_LIMITS: 1
        run: >-
          cargo nextest run --locked -p forge --test cli --no-fail-fast
          -E 'test(/symbolic_conformance::|symbolic_limits::/)'

  # If any of the jobs fail, this will create a normal-priority issue to signal so.
  issue:
    name: Open an issue
    runs-on: ubuntu-latest
    needs: [test]
    if: failure()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_URL: |
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          update_existing: true
          filename: .github/FLAKY_TEST_FAILURE_TEMPLATE.md

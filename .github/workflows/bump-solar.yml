name: Bump Solar Dependencies

permissions: {}

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  bump-solar:
    if: github.repository == 'foundry-rs/foundry'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bump solar dependencies
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/bump-solar.sh

      # App-authenticated PRs start CI without manual workflow approval.
      - name: Create repository-scoped App token
        id: app-token
        if: steps.bump.outputs.updated == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.FOUNDRY_RELEASE_APP_ID }}
          private-key: ${{ secrets.FOUNDRY_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update Pull Request
        if: steps.bump.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch-token: ${{ steps.app-token.outputs.token }}
          add-paths: |
            Cargo.toml
            Cargo.lock
          commit-message: "chore(deps): bump solar dependencies to ${{ steps.bump.outputs.latest_rev_short }}"
          title: "chore(deps): bump solar dependencies to ${{ steps.bump.outputs.latest_rev_short }}"
          labels: L-ignore
          body-path: ${{ steps.bump.outputs.changelog }}
          branch: deps/bump-solar

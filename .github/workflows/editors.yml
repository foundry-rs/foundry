name: Editors

permissions: {}

on:
  pull_request:
    paths:
      - "editors/**"
      - ".vscode/**"
      - ".github/workflows/editors.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "crates/forge/Cargo.toml"
      - "crates/forge/src/cmd/lsp.rs"
      - "crates/forge/src/cmd/lsp/**"
      - "crates/forge/src/opts.rs"
      - "crates/forge/tests/cli/lsp.rs"
      - "crates/forge/tests/support/lsp_client.rs"
  push:
    branches: [master]
    paths:
      - "editors/**"
      - ".github/workflows/editors.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "crates/forge/Cargo.toml"
      - "crates/forge/src/cmd/lsp.rs"
      - "crates/forge/src/cmd/lsp/**"
      - "crates/forge/src/opts.rs"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  vscode:
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@ee2960a6cc25d99bda45614135bfe1197d879bac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Install Forge and VS Code native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev xvfb libgtk-3-0 libgbm1 libnss3 libasound2t64
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          prefix-key: v2-editor-forge
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run check && npm test && npm run bundle:check
        working-directory: editors/vscode
      - name: Package licenses without symlinks
        working-directory: editors/vscode
        run: |
          rm LICENSE-MIT LICENSE-APACHE
          printf '%s' '../../LICENSE-MIT' > LICENSE-MIT
          printf '%s' '../../LICENSE-APACHE' > LICENSE-APACHE
          npm run package
          unzip -p bundle/solar-lsp.vsix extension/LICENSE-MIT | cmp - ../../LICENSE-MIT
          unzip -p bundle/solar-lsp.vsix extension/LICENSE-APACHE | cmp - ../../LICENSE-APACHE
      - run: cargo build --locked -p forge --bin forge
      - run: cargo test --locked -p forge --test cli 'lsp::'
      - name: Real Forge in VS Code Extension Development Host
        run: |
          xvfb-run -a npm run test:host
          xvfb-run -a npm run test:launcher
        working-directory: editors/vscode
        env:
          FORGE_PATH: ${{ github.workspace }}/target/debug/forge

  zed:
    runs-on: depot-ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@ee2960a6cc25d99bda45614135bfe1197d879bac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly
          components: rustfmt
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: editors/zed
          cache-bin: false
      - run: cargo +nightly fmt --manifest-path editors/zed/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path editors/zed/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path editors/zed/Cargo.toml
      - run: cargo build --locked --manifest-path editors/zed/Cargo.toml --target wasm32-wasip2 --release

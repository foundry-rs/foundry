name: CI Tempo

permissions: {}

on:
  schedule:
    - cron: "0 2 * * *" # Run daily at 2 AM UTC (offset from other nightlies)
  workflow_dispatch:
    inputs:
      network:
        description: "Tempo network to check"
        required: true
        type: choice
        options:
          - testnet
          - devnet
          - mainnet
          - all
      scripts:
        description: "Which scripts to run"
        required: false
        type: choice
        default: "both"
        options:
          - check
          - deploy
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  dependencies:
    if: github.event_name != 'schedule' || github.repository == 'foundry-rs/foundry'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/dependencies.yml

  tempo-check:
    needs: dependencies
    uses: ./.github/workflows/tempo.yml
    permissions:
      contents: read
      id-token: write
    with:
      artifact-id: ${{ needs.dependencies.outputs.artifact-id }}
      sha256: ${{ needs.dependencies.outputs.sha256 }}
      network: ${{ inputs.network || 'testnet' }}
      scripts: ${{ inputs.scripts || 'both' }}
    secrets:
      TEMPO_MAINNET_RPC_URL: ${{ secrets.TEMPO_MAINNET_RPC_URL }}
      TEMPO_TESTNET_RPC_URL: ${{ secrets.TEMPO_TESTNET_RPC_URL }}
      TEMPO_DEVNET_RPC_URL: ${{ secrets.TEMPO_DEVNET_RPC_URL }}
      VERIFIER_URL: ${{ secrets.VERIFIER_URL }}
      THROW_AWAY_MAINNET_PKEY: ${{ secrets.THROW_AWAY_MAINNET_PKEY }}

  # If the nightly run fails, this will create an issue to signal so.
  issue:
    name: Open an issue
    runs-on: ubuntu-latest
    needs: [dependencies, tempo-check]
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_URL: |
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          update_existing: true
          filename: .github/TEMPO_NIGHTLY_FAILURE_TEMPLATE.md

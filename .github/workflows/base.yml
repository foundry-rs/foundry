# Reusable workflow for Base checks and tests.

name: Base

permissions: {}

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"

jobs:
  check:
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check Base release binaries
        run: cargo check --locked --bins --no-default-features --features "aws-kms,gcp-kms,turnkey,cli,asm-keccak,js-tracer,base"
      - name: Check Base alongside Optimism
        run: cargo check --locked --bins --no-default-features --features "aws-kms,gcp-kms,turnkey,cli,asm-keccak,js-tracer,base,optimism"

  library-tests:
    name: library (${{ matrix.package }})
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - foundry-evm-hardforks
          - foundry-evm-networks
          - foundry-config
          - foundry-evm-core
          - foundry-cheatcodes
          - foundry-evm
          - foundry-evm-traces
          - foundry-common-fmt
          - foundry-primitives
          - forge-script
          - forge-verify
          - chisel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build Forge for verification tests
        if: matrix.package == 'forge-verify'
        run: cargo build --locked -p forge --features base
      - name: Test Base library
        run: cargo test --locked -p ${{ matrix.package }} --features base --lib -- --skip flaky_
      # `--lib` skips this target, which is how it once went unnoticed that it no longer compiled.
      - name: Test Base deterministic replay
        if: matrix.package == 'foundry-evm-core'
        run: cargo test --locked -p foundry-evm-core --features base --test base_replay

  integration-tests:
    name: integration (${{ matrix.suite }})
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: [anvil, cast, forge, chisel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Setup Python
        if: matrix.suite == 'forge'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Vyper
        if: matrix.suite == 'forge'
        # Also update vyper version in .devcontainer/Dockerfile.dev
        run: pip --version && pip install vyper==0.4.3
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test Base Anvil integration
        if: matrix.suite == 'anvil'
        run: |
          cargo test --locked -p anvil --features base --lib -- --skip flaky_
          cargo test --locked -p anvil --features base --test it base -- --test-threads=1
      - name: Test Base Cast integration
        if: matrix.suite == 'cast'
        run: |
          cargo test --locked --manifest-path crates/cast/Cargo.toml --features base \
            --lib base
          cargo test --locked --manifest-path crates/cast/Cargo.toml --features base \
            --test cli base -- --test-threads=1
      - name: Test Base Forge integration
        if: matrix.suite == 'forge'
        run: cargo test --locked -p forge --features base --test cli base -- --test-threads=1
      - name: Test Base Chisel integration
        if: matrix.suite == 'chisel'
        run: cargo test --locked -p chisel --features base --test it base -- --test-threads=1
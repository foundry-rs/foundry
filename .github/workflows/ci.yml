name: CI

permissions: {}

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"

jobs:
  dependencies:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/dependencies.yml

  test:
    needs: dependencies
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      id-token: write
    with:
      profile: default
      artifact-id: ${{ needs.dependencies.outputs.artifact-id }}
      sha256: ${{ needs.dependencies.outputs.sha256 }}
    secrets:
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      ARBITRUM_RPC: ${{ secrets.ARBITRUM_RPC }}
      ETH_SEPOLIA_RPC: ${{ secrets.ETH_SEPOLIA_RPC }}

  docs:
    needs: dependencies
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      artifact-id: ${{ needs.dependencies.outputs.artifact-id }}
      sha256: ${{ needs.dependencies.outputs.sha256 }}

  doctest:
    needs: dependencies
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        id: security
        uses: tempoxyz/gh-actions/actions/secure-runner@2794671f2a6e696217c8128ad4553a75bbba2709
        with:
          shims: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          artifact-id: ${{ needs.dependencies.outputs.artifact-id }}
          sha256: ${{ needs.dependencies.outputs.sha256 }}
      - run: cargo test --workspace --doc --frozen

  no-default-features:
    needs: dependencies
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        id: security
        uses: tempoxyz/gh-actions/actions/secure-runner@2794671f2a6e696217c8128ad4553a75bbba2709
        with:
          shims: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          artifact-id: ${{ needs.dependencies.outputs.artifact-id }}
          sha256: ${{ needs.dependencies.outputs.sha256 }}
      - run: cargo build --workspace --no-default-features --frozen

  touch-id-link:
    name: touch-id link (macOS)
    if: github.event_name == 'push'
    needs: dependencies
    runs-on: depot-macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Secure runner
        id: security
        uses: tempoxyz/gh-actions/actions/secure-runner@2794671f2a6e696217c8128ad4553a75bbba2709
        with:
          shims: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          artifact-id: ${{ needs.dependencies.outputs.artifact-id }}
          sha256: ${{ needs.dependencies.outputs.sha256 }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Run native Touch ID regressions
        run: |
          cargo test --manifest-path crates/cast/Cargo.toml --lib --features touch-id --target aarch64-apple-darwin --frozen cmd::wallet::tests
          cargo test --manifest-path crates/cast/Cargo.toml --test cli --features touch-id --target aarch64-apple-darwin --frozen wallet_change_password
      - name: Check Intel Touch ID linking
        run: |
          cargo test --manifest-path crates/cast/Cargo.toml --test cli --features touch-id --target x86_64-apple-darwin --frozen --no-run
          cargo build --manifest-path crates/forge/Cargo.toml --features touch-id --target x86_64-apple-darwin --frozen
      - run: cargo build --manifest-path crates/forge/Cargo.toml --features touch-id --target aarch64-apple-darwin --frozen

  typos:
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@4d9c206a77c041268485162b8e2579ad7a5cb9a3 # v1.50.0

  shellcheck:
    runs-on: depot-ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shellcheck
        shell: bash
        run: ./.github/scripts/shellcheck.sh
      - name: foundryup tests
        shell: bash
        run: ./foundryup/test.sh

  github-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test GitHub scripts
        run: |
          python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py'
          node --test .github/scripts/tests/test-create-tag.js .github/scripts/tests/test-dependencies.mjs .github/scripts/tests/test-solc-releases.mjs

  clippy:
    needs: dependencies
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        id: security
        uses: tempoxyz/gh-actions/actions/secure-runner@2794671f2a6e696217c8128ad4553a75bbba2709
        with:
          shims: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          artifact-id: ${{ needs.dependencies.outputs.artifact-id }}
          sha256: ${{ needs.dependencies.outputs.sha256 }}
          toolchain: nightly
          components: clippy
      - run: cargo +nightly clippy --workspace --all-targets --all-features --frozen
        env:
          RUSTFLAGS: -Dwarnings

  rustfmt:
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  forge-fmt:
    needs: dependencies
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        id: security
        uses: tempoxyz/gh-actions/actions/secure-runner@2794671f2a6e696217c8128ad4553a75bbba2709
        with:
          shims: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          artifact-id: ${{ needs.dependencies.outputs.artifact-id }}
          sha256: ${{ needs.dependencies.outputs.sha256 }}
      - name: forge fmt
        shell: bash
        run: ./.github/scripts/format.sh --check

  deny:
    needs: dependencies
    uses: tempoxyz/gh-actions/.github/workflows/rust-lint.yml@5aecd9fd9dca5935851b94f7cb853465e7f9158f # main
    permissions:
      contents: read
    secrets:
      STEP_SECURITY_API_KEY: ${{ secrets.STEP_SECURITY_API_KEY }}
    with:
      run-clippy: false
      run-fmt: false
      run-typos: false
      deny-rust-toolchain: nightly

  codeql:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{matrix.language}}"

  workflow-validation:
    name: Workflow Validation
    uses: tempoxyz/gh-actions/.github/workflows/scan-github-actions.yml@5aecd9fd9dca5935851b94f7cb853465e7f9158f # main
    permissions:
      actions: read
      contents: read
    secrets:
      STEP_SECURITY_API_KEY: ${{ secrets.STEP_SECURITY_API_KEY }}
    with:
      pinact: true

  ci-success:
    runs-on: ubuntu-latest
    if: always()
    permissions: {}
    needs:
      - dependencies
      - test
      - docs
      - doctest
      - no-default-features
      - touch-id-link
      - typos
      - shellcheck
      - github-scripts
      - clippy
      - rustfmt
      - forge-fmt
      - deny
      - codeql
      - workflow-validation
    timeout-minutes: 30
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: touch-id-link
          jobs: ${{ toJSON(needs) }}

name: Set up an approved Cargo build
description: Install CI tools and use only the dependency gate's source bundle

inputs:
  artifact-id:
    description: Artifact ID from the dependency gate
    required: true
  sha256:
    description: Bundle checksum from the dependency gate
    required: true
  toolchain:
    description: Rust toolchain
    default: stable
  components:
    description: Additional Rust components
    default: ""
  targets:
    description: Additional Rust targets
    default: ""
  svm-platform:
    description: Override the host solc metadata platform
    default: ""

outputs:
  cache-key:
    description: Cache namespace scoped to this PR or trusted build, job, and compiler
    value: ${{ steps.compiler-cache.outputs.key }}

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
    - uses: ./.github/actions/restore-dependencies
      with:
        artifact-id: ${{ inputs.artifact-id }}
        sha256: ${{ inputs.sha256 }}
        svm-platform: ${{ inputs.svm-platform }}
    - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
      if: runner.os == 'Linux'
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install --yes libudev-dev
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.17.0
    - name: Configure compiler-only cache
      id: compiler-cache
      shell: bash
      env:
        CACHE_NAMESPACE: approved-v2-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'trusted' }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ inputs.targets }}-${{ github.job }}
      run: |
        node --input-type=module -e '
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { appendFileSync } from "node:fs";
          import { join } from "node:path";
          const key = createHash("sha256")
            .update(process.env.CACHE_NAMESPACE)
            .update(execFileSync("rustc", ["-vV"]))
            .digest("hex");
          appendFileSync(process.env.GITHUB_ENV, [
            "SCCACHE_GHA_ENABLED=off",
            "SCCACHE_GHA_VERSION=",
            "SCCACHE_WEBDAV_ENDPOINT=",
            "SCCACHE_WEBDAV_TOKEN=",
            `SCCACHE_DIR=${join(process.env.RUNNER_TEMP, "sccache")}`,
            "SCCACHE_CACHE_SIZE=2G",
            "",
          ].join("\n"));
          appendFileSync(process.env.GITHUB_OUTPUT, `key=approved-compiler-v2-${key}\n`);
        '
    # Store only compiler outputs; dependency sources always come from the gate.
    # The Actions cache transport works on Depot as well as GitHub-hosted runners.
    - name: Restore compiler cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: ${{ steps.compiler-cache.outputs.key }}-${{ github.sha }}
        restore-keys: ${{ steps.compiler-cache.outputs.key }}-

name: Use approved Cargo dependencies
description: Verify this run's source bundle and configure a fresh offline Cargo home

inputs:
  artifact-id:
    description: Artifact ID from the dependency gate in this run
    required: true
  sha256:
    description: Bundle checksum from the dependency gate
    required: true
  svm-platform:
    description: Override the host platform for cross compilation
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Require an exact gate result
      shell: bash
      env:
        ARTIFACT_ID: ${{ inputs.artifact-id }}
        BUNDLE_SHA256: ${{ inputs.sha256 }}
      run: |
        node --input-type=module -e '
          import assert from "node:assert/strict";
          assert.match(process.env.ARTIFACT_ID, /^[1-9][0-9]*$/);
          assert.match(process.env.BUNDLE_SHA256, /^[a-f0-9]{64}$/);
        '
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        path: ${{ runner.temp }}/cargo-dependency-download
        merge-multiple: true
    - name: Verify and activate approved sources
      shell: bash
      env:
        DEPENDENCY_ARCHIVE: ${{ runner.temp }}/cargo-dependency-download/dependencies.tar.gz
        DEPENDENCY_SHA256: ${{ inputs.sha256 }}
        SVM_PLATFORM: ${{ inputs.svm-platform }}
      run: node .github/scripts/dependencies.mjs restore

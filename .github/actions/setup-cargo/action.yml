name: Setup Cargo after Socket
description: Fetch locked dependencies through Socket for an offline workspace build

runs:
  using: composite
  steps:
    - name: Fetch dependencies through Socket
      shell: bash
      run: |
        : "${SFW_SHIM_DIR:?Secure runner must install Socket Firewall first}"
        CARGO_NET_GIT_FETCH_WITH_CLI=true "$SFW_SHIM_DIR/cargo" fetch --locked

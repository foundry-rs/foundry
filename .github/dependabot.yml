version: 2
multi-ecosystem-groups:
  code-weekly:
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
updates:
  - package-ecosystem: npm
    directory: /editors/vscode
    patterns: ["*"]
    # vsce requires @types/vscode to stay within engines.vscode.
    ignore:
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    multi-ecosystem-group: code-weekly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /editors/zed
    allow:
      - dependency-type: all
    patterns: ["*"]
    multi-ecosystem-group: code-weekly
    cooldown:
      default-days: 7
  # This also refreshes SHA-only rust-toolchain pins. Keep them without a v1
  # comment because upstream moves that tag instead of publishing fixed releases.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    cooldown:
      # Dependabot truncates git tag timestamps to dates. Allow an extra day
      # beyond workflow-validation's seven-day commit-age minimum.
      default-days: 8
    groups:
      ci-weekly:
        patterns:
          - '*'

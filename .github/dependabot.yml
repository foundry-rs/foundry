version: 2
multi-ecosystem-groups:
  code-weekly:
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
updates:
  - package-ecosystem: npm
    directory: /editors/vscode
    patterns: ["*"]
    multi-ecosystem-group: code-weekly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /editors/zed
    patterns: ["*"]
    multi-ecosystem-group: code-weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    groups:
      ci-weekly:
        patterns:
          - '*'
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: code-weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: syn
        update-types:
          - version-update:semver-major
      - dependency-name: prettyplease
        update-types:
          - version-update:semver-minor
      - dependency-name: p256
        update-types:
          - version-update:semver-minor
      - dependency-name: ecdsa
        update-types:
          - version-update:semver-minor

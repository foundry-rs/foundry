version: 3

rules:
  # Tempo's shared workflows are SHA-pinned but do not publish releases that
  # pinact can use for version-comment or minimum-age verification.
  - ignore: true
    conditions:
      - expr: |
          ActionRepoFullName == "tempoxyz/gh-actions" &&
          ActionVersion matches "^[0-9a-f]{40}$"

  # rust-toolchain only publishes a moving v1 tag, so its historical SHA pins
  # cannot have stable version comments. Dependabot maintains the pins weekly.
  - ignore: true
    conditions:
      - expr: |
          ActionRepoFullName == "dtolnay/rust-toolchain" &&
          ActionVersion matches "^[0-9a-f]{40}$" &&
          VersionComment == ""
